name: Build Android

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths:
      - "clients/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "clients/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ANDROID_DIR: clients/android
  NDK_VERSION: 28.2.13676358
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/android/rust
      - run: cargo install cargo-ndk --locked

      - name: Build Rust core
        working-directory: clients/android/rust
        run: |
          cargo test
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../core/src/main/jniLibs build --release --lib

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/android-v') && env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Require signing secrets for release tags
        if: startsWith(github.ref, 'refs/tags/android-v') && env.ANDROID_KEYSTORE_BASE64 == ''
        run: exit 1

      - name: Generate UniFFI bindings
        working-directory: clients/android
        run: gradle --no-daemon :core:generateUniFfiBindings --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Compile Android
        working-directory: clients/android
        run: gradle --no-daemon :app:compileDebugKotlin --stacktrace

      - name: Test Android
        working-directory: clients/android
        run: gradle --no-daemon test --stacktrace

      - name: Lint Android
        working-directory: clients/android
        run: gradle --no-daemon lint --stacktrace

      - name: Build debug APKs
        working-directory: clients/android
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Rebuild signed release
        if: startsWith(github.ref, 'refs/tags/android-v') && env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: clients/android
        run: gradle --no-daemon assembleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name APKs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apks"
          if compgen -G "clients/android/app/build/outputs/apk/release/*arm64-v8a*.apk" > /dev/null; then
            cp clients/android/app/build/outputs/apk/release/*arm64-v8a*.apk "$RUNNER_TEMP/apks/LumosReader-android-arm64-v8a-release.apk"
            cp clients/android/app/build/outputs/apk/release/*armeabi-v7a*.apk "$RUNNER_TEMP/apks/LumosReader-android-armeabi-v7a-release.apk"
          else
            cp clients/android/app/build/outputs/apk/debug/*arm64-v8a*.apk "$RUNNER_TEMP/apks/LumosReader-android-arm64-v8a-debug.apk"
            cp clients/android/app/build/outputs/apk/debug/*armeabi-v7a*.apk "$RUNNER_TEMP/apks/LumosReader-android-armeabi-v7a-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LumosReader-Android-${{ github.sha }}
          path: ${{ runner.temp }}/apks/*.apk
          if-no-files-found: error

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-reports-${{ github.sha }}
          path: |
            clients/android/**/build/reports/**
            clients/android/.gradle/**/problems/**
          if-no-files-found: ignore

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/android-v')
        with:
          files: ${{ runner.temp }}/apks/*.apk
