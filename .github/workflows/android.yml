name: Build Android

on:
  push:
    branches: [main]
    tags: ["android-v*"]
  pull_request:
    paths:
      - "clients/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ANDROID_DIR: clients/android
  NDK_VERSION: 28.2.13676358
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure Gradle wrapper is executable
        run: chmod +x clients/android/gradlew

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/android/rust
      - run: cargo install cargo-ndk --locked

      - name: Build Rust core
        working-directory: clients/android/rust
        run: |
          cargo test
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../core/src/main/jniLibs build --release --lib

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/android-v')
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}"
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Require signing secrets for release tags
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: test -s "$RUNNER_TEMP/release.jks"

      - name: Generate UniFFI bindings
        working-directory: clients/android
        run: ./gradlew --no-daemon :core:generateUniFfiBindings --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Verify native bridge
        working-directory: clients/android
        shell: bash
        run: |
          test -f core/src/main/jniLibs/arm64-v8a/liblumos_core.so
          test -f core/src/main/jniLibs/armeabi-v7a/liblumos_core.so
          grep -Fq 'return "lumos_core"' core/build/generated/uniffi/uniffi/lumos_core/lumos_core.kt

      - name: Compile Android
        working-directory: clients/android
        run: ./gradlew --no-daemon :app:compileDebugKotlin --stacktrace

      - name: Test Android
        working-directory: clients/android
        run: ./gradlew --no-daemon test --stacktrace

      - name: Lint Android
        working-directory: clients/android
        run: ./gradlew --no-daemon lint --stacktrace

      - name: Build debug APKs
        working-directory: clients/android
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Rebuild signed release
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: clients/android
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          ./gradlew --no-daemon -PversionName="$version" -PversionCode="${GITHUB_RUN_NUMBER}" assembleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name APKs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apks"
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            arm64=(clients/android/app/build/outputs/apk/release/*arm64-v8a*.apk)
            armv7=(clients/android/app/build/outputs/apk/release/*armeabi-v7a*.apk)
            [[ ${#arm64[@]} -eq 1 && ${#armv7[@]} -eq 1 ]]
            cp "${arm64[0]}" "$RUNNER_TEMP/apks/LumosReader-arm64-v8a.apk"
            cp "${armv7[0]}" "$RUNNER_TEMP/apks/LumosReader-armeabi-v7a.apk"
          else
            arm64=(clients/android/app/build/outputs/apk/debug/*arm64-v8a*.apk)
            armv7=(clients/android/app/build/outputs/apk/debug/*armeabi-v7a*.apk)
            [[ ${#arm64[@]} -eq 1 && ${#armv7[@]} -eq 1 ]]
            cp "${arm64[0]}" "$RUNNER_TEMP/apks/LumosReader-arm64-v8a-debug.apk"
            cp "${armv7[0]}" "$RUNNER_TEMP/apks/LumosReader-armeabi-v7a-debug.apk"
          fi

      - name: Verify APKs
        shell: bash
        run: |
          for apk in "$RUNNER_TEMP"/apks/*.apk; do
            "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify "$apk"
            sha256sum "$apk"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: LumosReader-Android-${{ github.sha }}
          path: ${{ runner.temp }}/apks/*.apk
          if-no-files-found: error

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Android-build-reports-${{ github.sha }}
          path: |
            clients/android/**/build/reports/**
            clients/android/.gradle/**/problems/**
          if-no-files-found: ignore

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/android-v')
        with:
          name: LumosReader ${{ github.ref_name }}
          files: ${{ runner.temp }}/apks/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
