  <body>
    <h1>第一章　微光</h1>
    <p>书仍然安静地留在 NAS 里。屏幕只取来眼前这一页，像从远处捧来一小束光。</p>
    <p>阅读器不该替文字喧哗。合适的字号、行距和留白，让视线自然落下；翻页则应该轻快，在墨水屏上也能立刻收敛为无动画。</p>
    <p>这是一份用于验证 EPUB 元数据、封面、分页、双页与排版设置的最小样章。</p>
    <h2>留白</h2>
    <p>好的界面并不是没有细节，而是每一个细节都有理由。少一些按钮，多一点能呼吸的空间。</p>
    <p>当窗口转为横屏，可以尝试双页模式；回到竖屏时，阅读器会自动保持单列，避免六七英寸屏幕上的文字过窄。</p>
  </body>
</html>
